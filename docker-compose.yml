services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: my-app
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        container_name: my-app-nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    mysql:
        image: mysql:8.0
        container_name: my-app-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: my_app
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel

            # --- Redis Service ---
    redis:
        image: redis:alpine
        container_name: my_app_redis
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ""
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - laravel

networks:
    laravel:

volumes:
    mysql_data:
    redis_data:
